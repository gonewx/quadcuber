<script type="module">
// 渲染页: render.js 通过 window.renderLdr(模型文本, 选项) 调用, 返回 PNG 的 data URL。
import * as THREE from 'three';
import { LDrawLoader } from 'three/addons/loaders/LDrawLoader.js';

const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });

const ready = loader.preloadMaterials('/ldraw/colors/ldcfgalt.ldr');

// opts: w, h, yaw, pitch (度), maxStep (只显示到第几步), fitStep (按哪几步取景), margin, highlight (新零件步号)
window.renderLdr = async (text, opts) => {

        o.material = Array.isArray(o.material) ? nm : nm[0];

    }
  }

  renderer.setSize(W, H);
  const yaw = (opts.yaw ?? 35) * Math.PI / 180, pitch = (opts.pitch ?? 30) * Math.PI / 180;
  const dir = new THREE.Vector3(Math.sin(yaw) * Math.cos(pitch), Math.sin(pitch), Math.cos(yaw) * Math.cos(pitch));
  const box = new THREE.Box3();
  for (const c of group.children) if (c.visible) box.expandByObject(c);
  const ctr = new THREE.Vector3(); box.getCenter(ctr);
  const r = box.getSize(new THREE.Vector3()).length() / 2 || 50;
  const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, -r * 20, r * 20);
  cam.position.copy(ctr).addScaledVector(dir, r * 4); cam.lookAt(ctr); cam.updateMatrixWorld();
  const inv = cam.matrixWorldInverse; let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9;
  const v = new THREE.Vector3();

    const st = c.userData.buildingStep ?? 0;

      if (!o.isMesh) return;
      const pos = o.geometry.attributes.position; const stride = Math.max(1, Math.floor(pos.count / 300));

        x0 = Math.min(x0, v.x); x1 = Math.max(x1, v.x); y0 = Math.min(y0, v.y); y1 = Math.max(y1, v.y);
      }
    });
  }
  const m = opts.margin ?? 0.06; let cw = (x1 - x0) * (1 + 2 * m), ch = (y1 - y0) * (1 + 2 * m);
  if (cw / ch > W / H) ch = cw * H / W; else cw = ch * W / H;
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2;
  cam.left = cx - cw / 2; cam.right = cx + cw / 2; cam.top = cy + ch / 2; cam.bottom = cy - ch / 2;
  cam.updateProjectionMatrix();

};
window.pageReady = true;
</script></body></html>
