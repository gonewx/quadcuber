name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run unit tests
        run: python -m unittest -v
      - name: Check wiring documents
        run: python docs/wiring/build.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mechanical rebuild dependencies
        run: python -m pip install -r mechanical/final/requirements.txt
      - name: Check final assembly and reproducible models and pages
        run: |
          python -m unittest discover -s mechanical/final/manual -p 'test_*.py' -v
          python mechanical/final/site-source/test_final_presentation.py
          python mechanical/final/site-source/test_integrated_bundle.py
          python mechanical/final/check_rebuild.py
      - name: Check final reader and native models
        working-directory: mechanical/final/site-source
        run: |
          python viewer-dom-validation.py
          node --test gravity-step-pose.test.cjs unified-reader.test.cjs viewer-workbench-ui.test.cjs operation-workbench-ui.test.cjs
          node validate_integrated_models.cjs
