name: test
on:
  push:
  pull_request:
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install mechanical rebuild dependencies
        run: python -m pip install -r mechanical/requirements.txt
      - name: Build distributions from canonical sources
        run: python tools/build_distribution.py
      - name: Run unit tests and check wiring documents
        run: |
          python -m unittest -v
          python -m unittest discover -s electronics -p 'test_*.py' -v
          python wiring/build.py --check
      - name: Check assembly and reproducible models and pages
        run: |
          python -m unittest discover -s mechanical/assembly -p 'test_*.py' -v
          python web/test_final_presentation.py
          python web/test_integrated_bundle.py
          python tools/check_rebuild.py
      - name: Check readers and native models
        working-directory: web
        run: |
          python viewer-dom-validation.py
          node --test gravity-step-pose.test.cjs unified-reader.test.cjs viewer-workbench-ui.test.cjs operation-workbench-ui.test.cjs
          node validate_integrated_models.cjs
