<section id="step-builder" aria-labelledby="step-book-title" hidden>
  <div class="guide-heading"><h2 id="step-book-title">一步一步搭建</h2><a href="#v3d">整机3D</a></div>
  <div id="step-load-hold" class="load-warning" role="alert" hidden></div>
  <p id="step-book-status" class="notes" aria-live="polite"></p>
  <div class="step-navigation">
    <label>模块<select id="step-module"></select></label>
    <label>步骤<input id="step-number" type="number" min="1" step="1" inputmode="numeric"></label>
    <span id="step-counter"></span>
    <button id="step-previous" type="button">上一步</button><button id="step-next" type="button">下一步</button>
  </div>
  <article id="step-card" aria-labelledby="step-title">
    <div class="step-meta"><span id="step-id"></span><span id="step-action"></span></div>
    <h3 id="step-title"></h3><p id="step-hold" class="inventory-alert" role="alert" hidden></p>
    <p id="step-prerequisites" class="notes"></p>
    <div id="step-parts" class="step-parts" aria-label="本步零件"></div>
    <div class="step-image-tools"><button id="step-image-zoom" type="button" aria-pressed="false">放大细看</button><button id="step-3d" type="button">3D看这一步</button><button id="step-exit-3d" type="button" hidden>恢复整机3D</button></div>
    <p class="notes">图中查看插向和孔位；3D按最终装配坐标显示已装件，金色为本步件或正在合并的组件，不模拟插入动作</p>
    <div id="step-image-frame" tabindex="0" aria-label="当前步骤装配图，放大后可拖动或滑动查看"><img id="step-image" alt="" decoding="async"></div>
    <p id="step-image-error" class="notes" hidden>这张步骤图暂未载入，请先看文字或切换3D</p>
    <ol id="step-instructions"></ol>
    <details class="step-evidence"><summary>技术附录：编号、精确孔位与坐标</summary><p id="step-part-ids" class="notes"></p><ol id="step-technical-instructions" class="notes"></ol><ul id="step-insertion" class="notes"></ul><ul id="step-ports" class="notes"></ul></details>
    <p id="step-3d-status" class="notes" aria-live="polite"></p>
  </article>
  <div class="step-bottom-nav"><button id="step-previous-bottom" type="button">上一步</button><span id="step-bottom-counter"></span><button id="step-next-bottom" type="button">下一步</button></div>
</section>
