<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 720" role="img" aria-label="板外接线：电源插座、串联保险丝开关、降压模块与洞洞板端子" style="background:#f6f4ee;font-family:Arial,Microsoft YaHei,sans-serif"><text x="32" y="36" text-anchor="start" font-size="24" font-weight="bold" fill="#172c38">板外接线 · 先把降压输出调到 5.0V</text><rect x="45" y="92" width="100" height="70" rx="12" fill="#263744" stroke="#172a36" /><circle cx="65" cy="127" r="22" fill="#101b24" stroke="#a8afb1" stroke-width="5"/><circle cx="65" cy="127" r="5" fill="#c1b189"/><text x="95" y="190" text-anchor="middle" font-size="14" font-weight="normal" fill="#172c38">DC-005 · 5.5 × 2.1mm</text><text x="95" y="210" text-anchor="middle" font-size="13" font-weight="normal" fill="#172c38">中心正极 / 外套负极</text><rect x="233" y="99" width="142" height="48" rx="8" fill="#222e3a" stroke="#101b24" /><rect x="286" y="100" width="12" height="46" rx="1" fill="#626b71" stroke="none" /><text x="304" y="129" text-anchor="middle" font-size="16" font-weight="normal" fill="white">F1</text><text x="303" y="183" text-anchor="middle" font-size="14" font-weight="normal" fill="#172c38">线式保险丝座</text><text x="303" y="205" text-anchor="middle" font-size="12" font-weight="normal" fill="#172c38">额定值按实际电流选</text><rect x="462" y="91" width="82" height="68" rx="5" fill="#263644" stroke="#13232b" /><rect x="480" y="101" width="46" height="47" rx="4" fill="#a82e23" stroke="#222" /><text x="503" y="127" text-anchor="middle" font-size="14" font-weight="normal" fill="white">I / O</text><text x="503" y="183" text-anchor="middle" font-size="14" font-weight="normal" fill="#172c38">SW1 · 直流开关</text><rect x="766" y="91" width="276" height="95" rx="6" fill="#126aaa" stroke="#18415c" /><text x="904" y="116" text-anchor="middle" font-size="18" font-weight="bold" fill="white">洞洞板 J1</text><text x="904" y="142" text-anchor="middle" font-size="15" font-weight="normal" fill="white">1 / C3 = +9V</text><text x="904" y="167" text-anchor="middle" font-size="15" font-weight="normal" fill="white">2 / C5 = GND</text><path d="M145 114H233" fill="none" stroke="#d94a12" stroke-width="6" stroke-linejoin="round"/><path d="M375 114H462" fill="none" stroke="#d94a12" stroke-width="6" stroke-linejoin="round"/><path d="M544 114H696V138H766" fill="none" stroke="#d94a12" stroke-width="6" stroke-linejoin="round"/><path d="M145 145H186V238H696V163H766" fill="none" stroke="#263445" stroke-width="6" stroke-linejoin="round"/><text x="32" y="259" text-anchor="start" font-size="14" font-weight="normal" fill="#172c38">DC-005：两根短线接可拔 J1 插头；第三个切换脚留空。脚位用未供电插头 + 万用表确认。</text><text x="550" y="316" text-anchor="middle" font-size="23" font-weight="bold" fill="#172c38">两块模块的安装方式 · 侧视（上下拔插）</text><rect x="270" y="561" width="560" height="16" rx="2" fill="#d7ba7d" stroke="#8a6c40" /><text x="895" y="575" text-anchor="middle" font-size="15" font-weight="normal" fill="#172c38">洞洞板</text><rect x="270" y="385" width="560" height="14" rx="2" fill="#245c9d" stroke="#204c76" /><text x="550" y="374" text-anchor="middle" font-size="18" font-weight="bold" fill="#172c38">U2 降压模块（电感、电容朝上）</text><rect x="301" y="399" width="10" height="77" rx="0" fill="#d6b050" stroke="#8f7029" /><rect x="292" y="413" width="28" height="24" rx="2" fill="#1b2630" stroke="none" /><rect x="289" y="509" width="34" height="52" rx="3" fill="#1b2630" stroke="#0e1c25" /><rect x="299" y="508" width="14" height="7" rx="1" fill="#786542" stroke="none" /><rect x="302" y="575" width="8" height="24" rx="0" fill="#d6b050" stroke="#8f7029" /><path d="M306 483v18m-6 -7l6 7 6 -7" fill="none" stroke="#d56c21" stroke-width="3"/><rect x="783" y="399" width="10" height="77" rx="0" fill="#d6b050" stroke="#8f7029" /><rect x="774" y="413" width="28" height="24" rx="2" fill="#1b2630" stroke="none" /><rect x="771" y="509" width="34" height="52" rx="3" fill="#1b2630" stroke="#0e1c25" /><rect x="781" y="508" width="14" height="7" rx="1" fill="#786542" stroke="none" /><rect x="784" y="575" width="8" height="24" rx="0" fill="#d6b050" stroke="#8f7029" /><path d="M788 483v18m-6 -7l6 7 6 -7" fill="none" stroke="#d56c21" stroke-width="3"/><text x="550" y="438" text-anchor="middle" font-size="16" font-weight="normal" fill="#172c38">排针焊在模块上，模块可整块拔下</text><text x="550" y="486" text-anchor="middle" font-size="17" font-weight="bold" fill="#b45119">↓ 对准针脚，垂直插入 ↓</text><text x="550" y="543" text-anchor="middle" font-size="16" font-weight="normal" fill="#172c38">排母焊在洞洞板上</text><text x="550" y="617" text-anchor="middle" font-size="15" font-weight="normal" fill="#172c38">U1 同理：两排 1×8 排母。U2：四个分立 1 针排母，按四角电源焊孔定位。</text><text x="550" y="649" text-anchor="middle" font-size="15" font-weight="normal" fill="#172c38">U2 本图假设孔距 38.1 × 15.24mm；孔距不符时改排母位置，不掰模块硬插。</text><text x="550" y="681" text-anchor="middle" font-size="15" font-weight="normal" fill="#172c38">J1/J4 用可拔端子；J5 公排针对舵机母头；J6/J7 母座接公头线。</text></svg>